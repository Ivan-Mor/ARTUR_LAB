<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вариант 6 — Отсортированный массив</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header">
    <img src="/resource/logo.svg" alt="Логотип" class="logo">
    <div>
      <h1>Лабораторная работа №4. Вариант 6</h1>
      <p class="subtitle">Результат обработки массива</p>
    </div>
  </header>

  <main class="container">
    <section class="card highlight">
      <h2>Минимальный элемент массива</h2>
      <div id="min-value" class="min-box">—</div>
    </section>

    <section class="card">
      <h2>Массив после обработки (сортировка по возрастанию)</h2>
      <div id="sorted-table" class="table-wrap"></div>
    </section>

    <section class="actions">
      <a href="/" class="btn btn-link">Вернуться к исходному массиву</a>
    </section>
  </main>

  <footer class="footer">
    <p>Node.js · Введение в серверную разработку</p>
  </footer>

  <script src="/js/sorted.js"></script>
</body>
</html>
